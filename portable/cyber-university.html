in."],["To, Cc, Bcc","Xat kimga va nima uchun yuborilmoqda?","Har bir manzilning vazifasi bor."],["Pochta qutisi","Xatlarni yig‘mang — ularga keyingi amalni belgilang","Javob berish / Rejalashtirish / Mas’ulga yo‘naltirish / Arxivlash"],["Xatdan vazifaga","Muhim xatni aniq vazifaga aylantiring","Muddat — natija kerak bo‘ladigan payt. Ish vaqti — uni tayyorlash uchun ajratilgan vaqt."],["Xavfsizlik","Xatni ochishdan oldin tekshiring","Shubha tug‘ilsa, shoshilmang va mustaqil tekshiring."],["Phishing mashqi","Siz bu xatga ishonarmidingiz?","Shubhali belgilarni tekshiring va nima uchun xavfli ekanini aniqlang."],["Amaliy vaziyat","Endi ish jarayonini o‘zingiz tanlang","O‘rganganlaringizni bitta kundalik vaziyatga qo‘llang."],["Yakun va QR","Raqamli tartib — samarali ish faoliyatining asosi","Kichik, izchil odatlar kundalik ishni yengillashtiradi."]].map(([r,d,f],s)=>({id:s+1,label:r,title:d,subtitle:f})),nE=["Bu 30 daqiqalik seminarni amaliy namoyishlar boshqaradi. Barcha 14 bo‘limni ovoz chiqarib o‘qish shart emas: materialni telefoningizda o‘rganing va seminardan keyin ham unga qayting. Asosiy misol — oktabr faoliyati hisobotini tayyorlash.","Vazifalar ko‘pligi, noaniq talablar, resurslar yetishmasligi ham ishga ta’sir qiladi. Tartibli tizim barcha muammolarni hal qilmaydi, ammo topshiriq, muddat va javobni kuzatishni osonlashtiradi.","Hisobot so‘ralgan xatni o‘qing: qanday natija va qaysi shakl kerak? “Oktabr hisobotini tayyorlash” vazifasini yozing. 30-oktabr, 16:00 muddatini belgilang. 29-oktabr, 14:00–14:45 ni ish uchun ajrating. Hujjat tayyor bo‘lgach, ruxsatlarni tekshirib javob bering. Sanalar o‘quv misolidir.","Muhimlik natijaning maqsadga ta’sirini, shoshilinchlik esa vaqt bosimini bildiradi. Har bir so‘rovni darhol bajarish shart emas. Boshqa mas’ulga yo‘naltirishdan oldin o‘z vakolatingiz va uning imkoniyatini tekshiring.","Hisobotni topshirish muddatini taqvimdagi ish vaqti bilan adashtirmang. Ushbu taqvim o‘quv simulyatsiyasi: hech kimga taklif yoki bildirishnoma yubormaydi. Haftalik takrorlash tanlansa, boshlanish sanasidan 8 hafta davomida mahalliy nusxalar ko‘rsatiladi. Eslatma faqat tugma bosilganda namuna sifatida chiqadi.","mail.csu.uz tizimining provayderi va integratsiyalari bu qo‘llanmada tasdiqlanmagan. Google xizmatlari faqat alohida hisobdagi ixtiyoriy misol. Korporativ pochta avtomatik ravishda Google xizmatlariga ulanadi deb hisoblamang.","Aniq mavzu qabul qiluvchiga xatni topish va ustuvorlikni belgilashga yordam beradi. Hujjatni havola orqali ulashsangiz, kim ko‘rishi yoki tahrirlashi mumkinligini alohida tekshiring. Biriktirilgan fayl esa o‘sha paytdagi alohida nusxadir. Quyidagi hujjat saytdagi mahalliy o‘quv namunasidir.","Reply odatda yuboruvchiga javob beradi. Reply all ishlatilganda ko‘rinib turgan tegishli qabul qiluvchilarni tekshiring: hamma uchun zarurmi? Forward orqali yozishmani ulashishdan oldin mazmun va ilovalarni tekshiring. Bcc manzilni yashiradi, mazmunni himoyalamaydi.","Qutidagi har bir xat uchun keyingi amalni tanlang. Arxivlash xatni o‘chirmaydi: uni arxiv ko‘rinishida topish va qaytarish mumkin. Yulduz belgilash eslatma bo‘lishi mumkin, lekin aniq vazifa va muddatning o‘rnini bosmaydi. Qidiruv yuboruvchi, mavzu va matn bo‘yicha ishlaydi.","Vazifa xatning nusxasi emas, bajarilishi tekshiriladigan ish bo‘lsin. Ushbu mashqda xatdan yaratilgan vazifa saqlanadi va takroran yaratilmaydi. Ish vaqtini qo‘shish taqvimda shu vazifaga bog‘langan tadbir yaratadi. Javob esa faqat mahalliy loyiha: haqiqiy pochta jo‘natilmaydi.","Tanish ism, HTTPS belgisi va to‘g‘ri yozilgan matn xavfsizlikning isboti emas. Kutilmagan talabni avvaldan ma’lum aloqa usuli orqali mustaqil tasdiqlang. Shubhali xatni universitet belgilagan tartibda xabar qiling; bu yerda tasdiqlanmagan manzil tavsiya qilinmaydi.","Namuna ataylab yaratilgan va hech qanday tashqi sahifani ochmaydi. Har bir belgi xatdagi aniq joyni ajratib ko‘rsatadi. Xabardagi “30 daqiqa” bosim yaratadi; da’voni xatdagi havolani bosmasdan, xizmatning o‘zingiz bilgan manzili orqali tekshiring.","To‘g‘ri tanlov natijani tayyorlash uchun aniq reja beradi. Vaziyat o‘zgarsa, ish vaqtini yangilang va zarur bo‘lsa mas’ul bilan kelishing. Rejalashtirish ishning o‘z vaqtida bajarilishiga yordam beradi, lekin buning kafolati emas.","Bugunoq bitta muhim xatni tanlang. Undan vazifa yarating, muddatini yozing, taqvimda vaqt ajrating va yakunda javob bering. QR kod va havola o‘qish ko‘rinishini ochadi. Ushbu sayt haqiqiy pochta hisobiga ulanmaydi; mashqlar faqat shu brauzerda saqlanadi."],ac=[{title:"Muhim va shoshilinch",action:"Darhol bajaring",example:"Bugun topshiriladigan hisobot.",tone:"amber"},{title:"Muhim, shoshilinch emas",action:"Rejalashtiring",example:"Keyingi haftadagi ilmiy seminar tayyorgarligi.",tone:"cyan"},{title:"Shoshilinch, muhimligi past",action:"Vakolatga qarab yo‘naltiring",example:"Boshqa mas’ul xodim vakolatidagi tashkiliy so‘rov. Vakolat va imkoniyatni tekshiring.",tone:"blue"},{title:"Muhim ham, shoshilinch ham emas",action:"Zaruratini qayta baholang",example:"Ishga aloqasiz bildirishnoma.",tone:"muted"}],ay=["Yuboruvchining to‘liq manzilini tekshiring.","Havola manzilini tekshiring; shubhada xizmatni mustaqil oching.","Kutilmagan ilovalarni tekshirmasdan ochmang.","Ko‘p faktorli autentifikatsiyadan foydalaning.","Shubhali xatni universitet belgilagan tartibda xabar qiling."],Y0=[{title:"Shoshilinchlik orqali bosim",text:"“30 daqiqa” va “darhol” so‘zlari sizni tekshirmasdan harakat qilishga undaydi."},{title:"Parol so‘rash",text:"Xat orqali parol yoki bir martalik kod so‘ralishi xavf belgisi. Ularni yubormang."},{title:"Tanish bo‘lmagan yuboruvchi manzili",text:"IT Support nomi yetarli emas. security-alert@example.invalid universitetning tasdiqlangan manzili emas."},{title:"Shubhali havola",text:"account-check.example.invalid — ataylab berilgan namuna manzili. HTTPSning o‘zi ishonchlilikni isbotlamaydi."},{title:"Mustaqil tekshirishni talab qiladigan da’vo",text:"Hisob bloklanishi haqidagi da’voni xatdagi havolasiz, xizmatning ma’lum manzili yoki tasdiqlangan aloqa tartibi orqali tekshiring."}],ly=[{id:"report",sender:"Kafedra mas’uli",email:"kafedra@example.com",subject:"Oktabr hisoboti | Muddat: 30-oktabr, 16:00",body:"Assalomu alaykum, hurmatli hamkasblar! Oktabr oyi faoliyati bo‘yicha hisobotni 30-oktabr kuni soat 16:00 gacha yuborishingizni so‘raymiz. Hisobot shakli mahalliy namuna hujjatda. Ochish ruxsatini tekshiring. Hurmat bilan, Kafedra mas’uli",category:"Ish",time:"09:20",star:!1,archived:!1},{id:"meeting",sender:"Kotibiyat",email:"kotibiyat@example.com",subject:"Kafedra yig‘ilishi",body:"Payshanba kuni 10:00 da o‘quv rejalarini muhokama qilamiz. Qatnashish imkoniyatingizni bildiring.",category:"Uchrashuv",time:"09:05",star:!1,archived:!1},{id:"science",sender:"Ilmiy kengash",email:"ilm@example.com",subject:"Ilmiy konferensiya",body:"Keyingi haftadagi ilmiy konferensiya uchun ma’ruza mavzusini tayyorlang.",category:"Ilmiy",time:"Kecha",star:!1,archived:!1},{id:"student",sender:"Aziza Karimova",email:"talaba@example.com",subject:"Talaba murojaati",body:"Assalomu alaykum, mustaqil ish bo‘yicha maslahat vaqtini kelishsak bo‘ladimi?",category:"Ta’lim",time:"Kecha",star:!1,archived:!1},{id:"news",sender:"Axborot xizmati",email:"axborot@example.com",subject:"Axborot xabarnomasi",body:"Kutubxonadagi yangi elektron resurslar haqida ma’lumot.",category:"Axborot",time:"Dushanba",star:!1,archived:!1},{id:"suspicious",sender:"IT Support",email:"security-alert@example.invalid",subject:"Shubhali xavfsizlik xabari",body:"DIQQAT! Hisobingiz 30 daqiqadan keyin bloklanadi! Parolingizni tasdiqlang. Bu ataylab yaratilgan o‘quv namunasi.",category:"Tekshirish",time:"Dushanba",star:!1,archived:!1}],iE=["Topshiriqni aniqlash","Vazifa nomini yozish","Topshirish muddatini belgilash","Taqvimdan ish vaqtini ajratish","Natijani tayyorlash","Javob loyihasini yozish","Vazifani “Bajarildi” deb belgilash"],uE=["Vazifalarni faqat xotirada saqlamang.","Muhim xatga aniq keyingi ,screen:"Qidiruv natijasi, arxivdan qaytgan xat, qabul qiluvchi izohi va 5/5 ko‘rilgan belgilar.",say:"“Arxiv o‘chirish emas. Tanish ism xavfsizlikni kafolatlamaydi. Parol va tasdiqlash kodini xatda yubormaymiz.”",question:"Bu xatda sizni eng avval qaysi belgi to‘xtatadi?",outcome:"Ishtirokchi keyingi amalni belgilaydi va shubhali talabni mustaqil tekshirishni tanlaydi.",backup:"Barcha phishing matni darhol ko‘rinadi. Tugmalar ishlamagan taqdirda chop etilgan ma’ruzachi qo‘llanmasidagi belgilarni muhokama qiling."},{time:"25:00–28:00",title:"Mustaqil mashq va takrorlash",slides:"04, 13–14",prep:"13-bo‘limdagi vaziyatni oching.",steps:"Ishtirokchilarga javob tanlash uchun vaqt bering. Har uch javobni izohlang. Ustuvorlik matritsasida hisobotni joylashtiring. Uch yakuniy tavsiyani ko‘rsating.",screen:"B javobining izohi va to‘rtta bosqichli jarayon.",say:"“Reja ishni tugatishga yordam beradi. Sharoit o‘zgarsa, rejani ham yangilaymiz.”",question:"Bugun qaysi bitta xatingizni vazifaga aylantirasiz?",outcome:"Ishtirokchi kundalik ishiga tatbiq qiladigan bitta aniq qadamni tanlaydi.",backup:"Telefon ishlamasa, javoblarni og‘zaki yoki qo‘l ko‘tarish orqali yig‘ing."},{time:"28:00–30:00",title:"Savollar",slides:"14",prep:"QR kod va qo‘llanma havolasini ko‘rsating.",steps:"Taymerga qarab qolgan ikki daqiqani savollarga ajrating. Tizimga xos savollarni tasdiqlangan administrator ma’lumotiga yo‘naltiring.",screen:"“Savollar?” va qayta o‘qish uchun QR kod.",say:"“Qaysi bosqichni ish jarayoningizga kiritish osonroq? Platformaga xos imkoniyatlarni universitet sozlamalaridan tekshiramiz.”",question:"Qaysi amaliy qadam bo‘yicha savolingiz bor?",outcome:"Savollar aniqlashtiriladi, materialga qaytish yo‘li saqlanadi.",backup:"Javobi tasdiqlanmagan savolga taxmin qilmang; uni keyin aniqlashtirish uchun qayd eting."}],rE=["Namuna Google Docs hisobotini tayyorlang.","Ko‘ruvchi va tahrirlovchi ruxsatlarini tekshiring.","Gmail’da aniq xat yozing.","Hujjat havolasini kiriting.","To va Cc n
